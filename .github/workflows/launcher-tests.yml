name: Launcher unit tests

# Throwaway ci/realtime branch only: runs the launcher module's unit tests (natives lock, account self-heal, ...).
on:
  push:
    branches: [ci/realtime]
    paths: [".github/workflows/launcher-tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Launcher tests
        run: ./gradlew :launcher:test --no-daemon --console=plain
      - name: Collect
        if: always()
        run: |
          mkdir -p out; cp -r launcher/build/reports/tests out/ 2>/dev/null || true
          cp -r launcher/build/test-results out/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launcher-test-results
          path: out
