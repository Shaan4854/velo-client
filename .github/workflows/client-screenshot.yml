name: Client screenshot (software GL)

# Dev/test only. Boots the Velo mod client under Xvfb with Mesa software OpenGL, points it at the fork's
# Workers backend running locally (wrangler dev), saves screenshots and logs as an artifact, and checks that the
# offline account really signed in to the backend. Manual dispatch only - never runs on push or tags.
on:
  workflow_dispatch:
    inputs:
      minecraft_project:
        description: "Gradle project of the Minecraft version to run (e.g. 1.21.11)"
        required: false
        default: "1.21.11"
      run_seconds:
        description: "How long to let the client run before collecting results"
        required: false
        default: "420"

permissions:
  contents: read

jobs:
  shot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install display and software GL
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libgl1 mesa-utils libxrandr2 libxxf86vm1 libxcursor1 libxi6 libxinerama1 libopenal1 imagemagick x11-utils xdotool

      - name: Start the Workers backend locally
        working-directory: workers-backend
        run: |
          npm install --no-audit --no-fund
          nohup npx wrangler dev --local --port 8787 > ../wrangler.log 2>&1 &
          for i in $(seq 1 40); do curl -sf localhost:8787/v1/health && break; sleep 2; done
          curl -s localhost:8787/v1/health

      - name: Boot the client under Xvfb
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          MESA_GL_VERSION_OVERRIDE: "4.5"
          MESA_GLSL_VERSION_OVERRIDE: "450"
          DISPLAY: ":99"
          VELO_RUN_JVM_ARGS: "-Dvelo.serverUrl=http://127.0.0.1:8787 -Dvelo.screenshotTour=/tmp/tour -Dvelo.screenshotTour.boot=true -Dvelo.screenshotTour.noDemo=true -Xmx3g"
        run: |
          mkdir -p shots /tmp/tour
          Xvfb :99 -screen 0 1280x720x24 > xvfb.log 2>&1 &
          sleep 3
          # whole-screen shot every 30 s: works even if the in-game tour never runs
          ( i=0; while true; do sleep 30; i=$((i+1)); import -window root shots/screen-$(printf %03d $i).png 2>/dev/null || true; done ) &
          ./gradlew :${{ inputs.minecraft_project }}:runClient --no-daemon --no-configuration-cache --configure-on-demand --no-parallel -Dorg.gradle.jvmargs=-Xmx1500m > client.log 2>&1 &
          GRADLE=$!
          sleep ${{ inputs.run_seconds }}
          echo "--- online list (should contain the dev client's offline name) ---"
          curl -s localhost:8787/v1/online | tee online.json
          echo
          import -window root shots/final.png || true
          kill $GRADLE 2>/dev/null || true
          pkill -f net.fabricmc.devlaunchinjector || true
          grep -E "Velo|offline|Offline" client.log | tail -40 || true
          python3 - <<'PY'
          import json, sys
          users = json.load(open("online.json")).get("users", [])
          print("online users:", [u["username"] for u in users])
          sys.exit(0 if users else 1)
          PY

      - name: Collect results
        if: always()
        run: |
          mkdir -p out
          cp -r shots out/ 2>/dev/null || true
          cp -r /tmp/tour out/tour 2>/dev/null || true
          cp client.log wrangler.log xvfb.log online.json out/ 2>/dev/null || true
          find run -name latest.log -exec cp {} out/game-latest.log \; 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-screenshots
          path: out
          retention-days: 7
